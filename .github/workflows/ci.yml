name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: src/ml_pipeline/requirements.txt
      - name: Install test dependencies
        # Only what the tests import, pinned by the module's requirements file
        # (skips torch/transformers — the fine-tune is not run in CI).
        run: |
          python -m pip install --upgrade pip
          pip install -c src/ml_pipeline/requirements.txt trafilatura datasketch langdetect pytest
      - name: Run tests
        working-directory: src
        run: python -m pytest ml_pipeline/tests -v

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install ruff==0.17.0
      - name: Lint ML pipeline (full rule set from ruff.toml)
        run: ruff check src/ml_pipeline
      - name: Lint crawler (critical errors only — syntax errors, undefined names)
        run: ruff check src --exclude src/ml_pipeline --select E9,F63,F7,F82

  dependencies:
    name: Dependencies resolve
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install uv==0.11.26
      - name: Crawler + ML pins install together (Python 3.10 and 3.13)
        # The other jobs install subsets; this catches pins that conflict in a full install.
        run: |
          for py in 3.10 3.13; do
            uv pip compile --python-version "$py" -q \
              requirements.txt src/ml_pipeline/requirements.txt -o "resolved-$py.txt"
          done

  crawler-smoke:
    name: Crawler smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install import-time dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -c requirements.txt playwright playwright-stealth gspread google-auth openpyxl
      - name: Compile every module
        run: python -m compileall -q src
      - name: Every CLI starts and prints --help
        working-directory: src
        run: |
          for f in rabbit_hole_crawler influncers_yt_finderScript brand_sourcer brand_enricher \
                   brand_contact_finder email_finder email_verifier; do
            echo "::group::$f --help"
            python "$f.py" --help
            echo "::endgroup::"
          done
